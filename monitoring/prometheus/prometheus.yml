global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trustlane
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # The store edge process (python -m server.edge --port 8100). One target per store.
  - job_name: trustlane-edge
    static_configs:
      - targets: ["host.docker.internal:8100"]
        labels: {store: store-1}
